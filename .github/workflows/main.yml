name: Build BookCompass for iPhone

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml

      - name: Archive app without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project BookVoice.xcodeproj \
            -scheme BookVoice \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/BookVoice.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_STYLE=Manual \
            SKIP_INSTALL=NO \
            2>&1 | tee "$RUNNER_TEMP/BookCompass-xcodebuild.log"

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/BookVoice.xcarchive/Products/Applications/BookVoice.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/bookcompass-ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/bookcompass-ipa/Payload/BookVoice.app"
          cd "$RUNNER_TEMP/bookcompass-ipa"
          zip -qr "$GITHUB_WORKSPACE/BookCompass-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BookCompass-unsigned-IPA
          path: BookCompass-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload Xcode build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BookCompass-build-log
          path: ${{ runner.temp }}/BookCompass-xcodebuild.log
          if-no-files-found: ignore
